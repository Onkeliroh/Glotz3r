# Builds the executables and publishes a GitHub release when a version tag (v1.2.3) is pushed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          # stamp the tag into the page (shown in the settings); fail if the placeholder is gone
          sed -i "s/const VERSION = 'dev'/const VERSION = '$GITHUB_REF_NAME'/" web/index.html
          grep -q "const VERSION = '$GITHUB_REF_NAME'" web/index.html
          mkdir dist
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            ext=''; [ "$os" = windows ] && ext='.exe'
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags '-s -w' -o "dist/glotz3r-$os-$arch$ext" .
          done
          # the page alone, for hosting on any web server
          (cd web && zip -r ../dist/glotz3r-web.zip .)
          (cd dist && sha256sum * > checksums.txt)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
